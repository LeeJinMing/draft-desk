<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draft Desk</title>
  <meta name="draft-validator" content="server">
  <link rel="stylesheet" href="./site.css">
  <script type="module" src="./draft.js"></script>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Draft Desk</h1>
        <p id="series">Loading synthetic series…</p>
      </div>
      <label>Draft rules
        <select id="mode"><option value="fearless">Hard Fearless</option><option value="standard">Standard</option></select>
      </label>
    </header>
    <div class="controls">
      <label>Import series JSON <input id="import" type="file" accept=".json,application/json"></label>
      <button id="export" disabled>Export series JSON</button>
    </div>
    <section aria-labelledby="draft-heading">
      <h2 id="draft-heading">Current draft</h2>
      <div class="slots">
        <div><h3>Blue picks</h3><ol id="blue"></ol></div>
        <div><h3>Red picks</h3><ol id="red"></ol></div>
        <div><h3>Bans</h3><ol id="bans"></ol></div>
      </div>
      <div class="controls">
        <label>Add next champion to
          <select id="action"><option value="blue">Blue picks</option><option value="red">Red picks</option><option value="bans">Bans</option></select>
        </label>
        <button id="advance" disabled>Record game and advance</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section aria-labelledby="history-heading">
      <h2 id="history-heading">Recorded games</h2>
      <ol id="history"></ol>
    </section>
    <section aria-labelledby="pool-heading">
      <h2 id="pool-heading">Champion pool</h2>
      <p id="counts"></p>
      <div class="pool" id="pool"></div>
    </section>
  </main>
</body>
</html>
